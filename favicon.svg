<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f5ff" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Cyber Background -->
  <rect width="64" height="64" rx="14" fill="#050a14"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" stroke-opacity="0.85"/>
  
  <!-- Terminal Prompt > -->
  <path d="M17 21L29 32L17 43" fill="none" stroke="#00f5ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Terminal Cursor _ -->
  <path d="M34 43L47 43" fill="none" stroke="#00f5ff" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
</svg>
